# CI on every push (CLAUDE.md §3): what `make ci` runs locally.
# Today: lint (no RTL yet) + model-test (pytest, mypy --strict, ruff).
# Add verilator / SymbiYosys / riscv toolchain installs here when `sim`, `formal`, `fw` exist.
name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Setup (venv + pinned requirements)
        run: make setup
      - name: make ci
        run: make ci
