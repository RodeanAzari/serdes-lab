[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["model/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["skrf", "skrf.*"]
ignore_missing_imports = true
